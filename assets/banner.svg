      <stop offset="0" stop-color="#2f7fbf"/>
      <stop offset="1" stop-color="#14304f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#background)"/>

  <g transform="translate(250 180) scale(2.6)">
    <path fill="#ffffff" d="M8 32C15 19.5 23 14 32 14s17 5.5 24 18c-7 12.5-15 18-24 18S15 44.5 8 32z"/>
